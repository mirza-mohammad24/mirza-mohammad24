name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
                        # deliberately no `push` trigger -- this job commits,
                        # and a push trigger would re-run it on its own commit

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py
        # run from repo root, same as make_ascii_svg.py: font paths
        # (fonts/data-*.woff2) and output paths (stats.svg etc.) are
        # relative to cwd, and python3 scripts/generate_stats.py auto-adds
        # scripts/ to sys.path so the stats_common/stats_render imports
        # resolve without needing a working-directory change

      - run: |
          FILES="stats-dark.svg stats-light.svg streak-dark.svg streak-light.svg langs-dark.svg langs-light.svg heatmap-dark.svg heatmap-light.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No change to stats, skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push